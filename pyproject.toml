[project]
name = "lobgen"
version = "0.1.0"
description = "Regime-conditioned generative modelling of limit order books (DiffLOB, LOB GAN) on Eurex FESX"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "torch",
    "pyyaml",
    "matplotlib",
    "lightgbm",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
